<HTML>
<HEAD>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    background-color: #f5f5f5;
  }
  #hangman-card {
    width: 90vw;
    max-width: 500px;
    height: 90vh;
    max-height: 600px;
    border: 1px solid #ccc;
    border-radius: 8px;
    font-family: Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: space-evenly;
    padding: 2vh 2vw;
    box-sizing: border-box;
    text-align: center;
    background-color: white;
  }
  #hangman-title {
    font-size: clamp(18px, 4vw, 32px);
    font-weight: bold;
    margin: 0;
  }
  #hangman-figure {
    font-size: clamp(12px, 2.2vw, 22px);
    white-space: pre;
    line-height: 1.2;
    font-family: monospace;
    margin: 1vh 0;
  }
  #hangman-word {
    font-size: clamp(16px, 3vw, 28px);
    letter-spacing: 0.3em;
    font-family: monospace;
    margin: 1vh 0;
  }
  #hangman-keyboard {
    display: flex;
    flex-wrap: wrap;
    justify-content: center;
    gap: 0.6vw;
    max-width: 95%;
  }
  #hangman-keyboard button {
    font-size: clamp(10px, 1.6vw, 16px);
    width: clamp(20px, 3.6vw, 36px);
    height: clamp(20px, 3.6vw, 36px);
    padding: 0;
    cursor: pointer;
  }
  #hangman-keyboard button:disabled {
    opacity: 0.3;
    cursor: default;
  }
  #hangman-status {
    font-size: clamp(12px, 2vw, 18px);
    min-height: 1.5em;
    margin: 1vh 0;
  }
  #hangman-reset {
    font-size: clamp(12px, 2vw, 18px);
    padding: 0.5em 1.2em;
    cursor: pointer;
    margin-top: 1vh;
  }
</style>
</HEAD>
<BODY>
<div id="hangman-card">
  <p id="hangman-title">Hangman</p>
  <div id="hangman-figure" role="img" aria-label=""></div>
  <div id="hangman-word"></div>
  <div id="hangman-status" aria-live="polite"></div>
  <div id="hangman-keyboard"></div>
  <button id="hangman-reset" onclick="startHangman()">Play Again</button>
</div>

<script>
  var HANGMAN_WORDS = ["denver", "hangman", "sprint", "github", "branch", "ticket", "keyboard", "internship"];
  var MAX_WRONG = 6;

  var hangmanWord = "";
  var guessedLetters = [];
  var wrongCount = 0;
  var gameOver = false;

  var HANGMAN_STAGES = [
    "\n\n\n\n=====",
    "  +--+\n  |\n  |\n  |\n=====",
    "  +--+\n  |  |\n  |\n  |\n=====",
    "  +--+\n  |  |\n  O  |\n  |\n=====",
    "  +--+\n  |  |\n  O  |\n  |  |\n=====",
    "  +--+\n  |  |\n  O  |\n /|  |\n=====",
    "  +--+\n  |  |\n  O  |\n /|\\ |\n=====",
    "  +--+\n  |  |\n  O  |\n /|\\ |\n /  \\====="
  ];

  var HANGMAN_STAGE_DESCRIPTIONS = [
    "Empty gallows, no wrong guesses yet",
    "Gallows post drawn, 1 wrong guess",
    "Gallows with crossbar drawn, 2 wrong guesses",
    "Head added to hanging figure, 3 wrong guesses",
    "Head and body added to hanging figure, 4 wrong guesses",
    "Head, body, and one arm added to hanging figure, 5 wrong guesses",
    "Head, body, and both arms added to hanging figure, 6 wrong guesses",
    "Full hanging figure with arms and legs drawn, out of guesses"
  ];

  function startHangman() {
    hangmanWord = HANGMAN_WORDS[Math.floor(Math.random() * HANGMAN_WORDS.length)];
    guessedLetters = [];
    wrongCount = 0;
    gameOver = false;
    renderHangman();
  }

  function guessLetter(letter) {
    if (gameOver || guessedLetters.indexOf(letter) !== -1) {
      return;
    }
    guessedLetters.push(letter);
    if (hangmanWord.indexOf(letter) === -1) {
      wrongCount++;
    }
    checkHangmanEnd();
    renderHangman();
  }

  function checkHangmanEnd() {
    var allGuessed = hangmanWord.split("").every(function (ch) {
      return guessedLetters.indexOf(ch) !== -1;
    });
    if (allGuessed) {
      gameOver = true;
    } else if (wrongCount >= MAX_WRONG) {
      gameOver = true;
    }
  }

  function renderHangman() {
    var figureEl = document.getElementById("hangman-figure");
    var wordEl = document.getElementById("hangman-word");
    var statusEl = document.getElementById("hangman-status");
    var keyboardEl = document.getElementById("hangman-keyboard");

    var stageIndex = Math.min(wrongCount, MAX_WRONG);
    figureEl.textContent = HANGMAN_STAGES[stageIndex];
    figureEl.setAttribute("aria-label", HANGMAN_STAGE_DESCRIPTIONS[stageIndex]);

    var display = hangmanWord.split("").map(function (ch) {
      return guessedLetters.indexOf(ch) !== -1 ? ch : "_";
    }).join(" ");
    wordEl.textContent = display;

    var won = hangmanWord.split("").every(function (ch) {
      return guessedLetters.indexOf(ch) !== -1;
    });

    if (won) {
      statusEl.textContent = "You win!";
    } else if (wrongCount >= MAX_WRONG) {
      statusEl.textContent = "Out of guesses: " + hangmanWord;
    } else {
      statusEl.textContent = "Wrong guesses: " + wrongCount + "/" + MAX_WRONG;
    }

    keyboardEl.innerHTML = "";
    var alphabet = "abcdefghijklmnopqrstuvwxyz".split("");
    alphabet.forEach(function (letter) {
      var btn = document.createElement("button");
      btn.textContent = letter;
      btn.setAttribute("aria-label", "Guess letter " + letter);
      btn.disabled = gameOver || guessedLetters.indexOf(letter) !== -1;
      btn.onclick = function () {
        guessLetter(letter);
      };
      keyboardEl.appendChild(btn);
    });
  }

  startHangman();
</script>
</BODY>
</HTML>
